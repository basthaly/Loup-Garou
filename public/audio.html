<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Loup-Garou — Mixage de l'ambiance</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
  <style>
    .mix { max-width: 860px; margin: 0 auto; padding: 28px 20px 60px; display: flex; flex-direction: column; gap: 18px; }
    .mix h1 { font-family: 'Cormorant Garamond', serif; font-size: 40px; margin: 0; }
    .mix .card { background: var(--zone); border: 1px solid var(--border); border-radius: 18px; padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; }
    .mbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
    .grp { margin: 14px 0 0; font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
    .strip { display: grid; grid-template-columns: 96px 1fr 74px 150px auto; align-items: center; gap: 12px; padding: 6px 0; border-bottom: 1px solid var(--border); }
    .strip:last-child { border-bottom: none; }
    .strip b { font-size: 15px; }
    .strip input[type=range] { width: 100%; accent-color: var(--accent); min-height: 32px; }
    .db { font-variant-numeric: tabular-nums; font-weight: 700; text-align: right; }
    .db input { width: 70px; text-align: right; font: inherit; padding: 4px 6px; }
    .meter { position: relative; height: 10px; border-radius: 5px; background: var(--surface2); overflow: hidden; }
    .meter i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: linear-gradient(90deg, #5FBF8A 0 70%, #E8C25D 70% 88%, #E06B5D 88%); transition: width .08s linear; }
    .lvl { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; margin-top: 3px; }
    .tools { display: flex; gap: 6px; }
    .tools button { min-height: 34px; min-width: 34px; padding: 0 9px; font-size: 13px; font-weight: 700; }
    .tools button.on.s { background: #E8C25D; color: #1A1408; border-color: #E8C25D; }
    .tools button.on.m { background: #E06B5D; color: #fff; border-color: #E06B5D; }
    .mix textarea, .db input { background: var(--surface2); color: var(--text); border: 1px solid var(--border); border-radius: 10px; }
    .mix textarea { padding: 10px; }
    textarea { width: 100%; min-height: 120px; font-family: ui-monospace, Menlo, monospace; font-size: 13px; }
    @media (max-width: 700px) { .strip { grid-template-columns: 1fr auto; } .strip input[type=range] { grid-column: 1 / -1; } .strip .m-wrap { grid-column: 1 / -1; } }
  </style>
</head>
<body data-appearance="dark" data-theme="night">
  <main class="mix">
    <h1>Mixage de l'ambiance</h1>
    <p class="muted">Règle chaque son en dB (0 dB = niveau de base du son, −60 = coupé). « S » pour écouter un son seul, « M » pour le couper. Tes réglages s'appliquent aussi à tes parties sur ce navigateur. Copie les valeurs pour les transmettre.</p>
    <div class="card">
      <div class="mbar">
        <button class="primary" id="go">Démarrer</button>
        <div class="seg" role="group" aria-label="Ambiance"><button id="m-night" class="on">Nuit</button><button id="m-day">Jour</button></div>
        <label class="row" style="gap:8px;margin:0">Volume d'écoute <input type="range" id="vol" min="0" max="100" style="width:140px"> <span id="vol-v" class="db"></span></label>
      </div>
      <div class="mbar">
        <span class="muted">Déclencher :</span>
        <button class="ghost small-btn" data-fire="owl">Hibou</button>
        <button class="ghost small-btn" data-fire="thunder">Tonnerre</button>
        <button class="ghost small-btn" data-fire="crickets">Grillons</button>
        <button class="ghost small-btn" data-fire="drops">Goutte</button>
        <button class="ghost small-btn" data-fire="wolf">Loup</button>
        <button class="ghost small-btn" data-fire="frogs">Grenouilles</button>
        <button class="ghost small-btn" data-fire="birds">Oiseaux</button>
        <button class="ghost small-btn" data-fire="bell">Cloche</button>
        <button class="ghost small-btn" data-fire="fire">Crépitement</button>
        <button class="ghost small-btn" data-fire="harp">Glissando de harpe</button>
        <button class="ghost small-btn" data-fire="flute">Flûte</button>
        <button class="ghost small-btn" data-fire="harp2">Harpe grave</button>
      </div>
    </div>
    <div class="card" id="strips"></div>
    <div class="card">
      <div class="mbar"><button class="primary" id="copy">Copier les valeurs</button><button class="ghost" id="reset">Revenir aux valeurs du jeu</button><span id="copied" class="muted"></span></div>
      <textarea id="out" readonly aria-label="Valeurs à copier"></textarea>
      <label for="in">Coller des valeurs (le texte copié plus haut)</label>
      <textarea id="in" placeholder="Colle ici puis « Appliquer »"></textarea>
      <div class="mbar"><button class="ghost" id="apply">Appliquer</button></div>
    </div>
  </main>
  <script src="/ambience.js"></script>
  <script src="/audio.js"></script>
</body>
</html>
