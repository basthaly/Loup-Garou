<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Tableau de bord du maître du jeu</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#E8A75D}a:hover{color:#F5C58C}
</style>
</helmet>
<div style="min-height: 100vh; background: #11131A; color: #EEEAE2; font-family: Inter, system-ui, sans-serif; font-size: 15px; line-height: 1.5">
  <header style="border-bottom: 1px solid #30354A">
    <div style="max-width: 1320px; margin: 0 auto; padding: 16px 24px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px">
      <div style="display: flex; align-items: center; gap: 10px">
        <svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#E8A75D" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"></path></svg>
        <span style="font-family: 'Cormorant Garamond', serif; font-size: 28px; font-weight: 700">Loup-Garou</span>
        <span style="display: flex; align-items: center; gap: 6px; margin-left: 8px; background: #3A2E1C; color: #F5C58C; border-radius: 999px; padding: 4px 12px; font-size: 13px; font-weight: 700">
          <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#F5C58C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8l4 4 5-7 5 7 4-4-2 11H5z"></path></svg>
          Sophie · Maître du jeu
        </span>
      </div>
      <div style="display: flex; align-items: center; gap: 12px; flex-wrap: wrap">
        <span style="background: #1A1D27; border: 1px solid #30354A; border-radius: 999px; padding: 6px 14px; font-weight: 600">Nuit 2</span>
        <button type="button" style="background: transparent; color: #EEEAE2; border: 1px solid #30354A; border-radius: 10px; padding: 10px 16px; font: 600 14px Inter, sans-serif; min-height: 44px; cursor: pointer">Rendre la main au site</button>
      </div>
    </div>
  </header>
  <main style="max-width: 1320px; margin: 0 auto; padding: 24px 24px 48px; display: flex; flex-direction: column; gap: 24px">
    <div style="display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start">
      <section style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 24px">
        <div style="background: #1A1D27; border: 1px solid #30354A; border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 14px">
          <h2 style="margin: 0; font-size: 18px; font-weight: 600">Déroulé de la nuit</h2>
          <ol style="list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px">
            <sc-for list="{{ steps }}" as="s" hint-placeholder-count="4">
              <li style="background: {{s.bg}}; border: 1px solid {{s.border}}; border-radius: 12px; padding: 12px 14px">
                <div style="font-size: 12px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: {{s.stateColor}}">{{s.state}}</div>
                <div style="font-weight: 700">{{s.name}}</div>
                <div style="font-size: 13px; color: #A9A69F">{{s.detail}}</div>
              </li>
            </sc-for>
          </ol>
          <div style="display: flex; flex-wrap: wrap; gap: 10px">
            <button type="button" style="background: #E8A75D; color: #1A1408; border: none; border-radius: 12px; padding: 12px 20px; font: 700 15px Inter, sans-serif; min-height: 48px; cursor: pointer">Réveiller la Sorcière</button>
            <button type="button" style="background: #232736; color: #EEEAE2; border: 1px solid #30354A; border-radius: 12px; padding: 12px 18px; font: 600 15px Inter, sans-serif; min-height: 48px; cursor: pointer">Passer au jour</button>
          </div>
        </div>
        <div style="background: #1A1D27; border: 1px solid #30354A; border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 14px">
          <h2 style="margin: 0; font-size: 18px; font-weight: 600">Joueurs et rôles</h2>
          <div style="overflow-x: auto">
            <table style="width: 100%; min-width: 620px; border-collapse: collapse; font-size: 14px">
              <thead>
                <tr style="text-align: left; color: #A9A69F">
                  <th style="padding: 8px 10px; font-weight: 600">Joueur</th>
                  <th style="padding: 8px 10px; font-weight: 600">Rôle</th>
                  <th style="padding: 8px 10px; font-weight: 600">État</th>
                  <th style="padding: 8px 10px; font-weight: 600">Caméra / micro</th>
                  <th style="padding: 8px 10px; font-weight: 600"><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Actions</span></th>
                </tr>
              </thead>
              <tbody>
                <sc-for list="{{ rows }}" as="r" hint-placeholder-count="10">
                  <tr style="border-top: 1px solid #30354A">
                    <td style="padding: 10px; font-weight: 600">{{r.name}}</td>
                    <td style="padding: 10px; color: {{r.roleColor}}; font-weight: 600">{{r.role}}</td>
                    <td style="padding: 10px; color: {{r.stateColor}}">{{r.state}}</td>
                    <td style="padding: 10px; color: #A9A69F">{{r.media}}</td>
                    <td style="padding: 6px 10px; text-align: right">
                      <button type="button" aria-label="{{r.actionLabel}}" style="background: #232736; color: #EEEAE2; border: 1px solid #30354A; border-radius: 8px; padding: 8px 12px; font: 600 13px Inter, sans-serif; min-height: 44px; cursor: pointer">Couper le micro</button>
                    </td>
                  </tr>
                </sc-for>
              </tbody>
            </table>
          </div>
        </div>
      </section>
      <aside style="flex: 1 1 360px; min-width: 0; display: flex; flex-direction: column; gap: 16px">
        <div style="background: #1A1D27; border: 1px solid #30354A; border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 10px">
          <h2 style="margin: 0; font-size: 18px; font-weight: 600">Contrôles</h2>
          <button type="button" style="background: #232736; color: #EEEAE2; border: 1px solid #30354A; border-radius: 10px; padding: 12px 14px; font: 600 14px Inter, sans-serif; min-height: 44px; cursor: pointer; text-align: left">Couper toutes les caméras du village</button>
          <button type="button" style="background: #232736; color: #EEEAE2; border: 1px solid #F08A6C; border-radius: 10px; padding: 12px 14px; font: 600 14px Inter, sans-serif; min-height: 44px; cursor: pointer; text-align: left">Fermer le salon des loups</button>
          <button type="button" style="background: #232736; color: #EEEAE2; border: 1px solid #30354A; border-radius: 10px; padding: 12px 14px; font: 600 14px Inter, sans-serif; min-height: 44px; cursor: pointer; text-align: left">Ouvrir le vote du village</button>
          <button type="button" disabled="disabled" style="background: #1A1D27; color: #A9A69F; border: 1px dashed #30354A; border-radius: 10px; padding: 12px 14px; font: 600 14px Inter, sans-serif; min-height: 44px; cursor: not-allowed; text-align: left">Révéler les votes (quand tous ont voté)</button>
        </div>
        <div style="background: #1A1D27; border: 1px solid #30354A; border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 10px">
          <h2 style="margin: 0; font-size: 18px; font-weight: 600">Journal de la nuit</h2>
          <sc-for list="{{ log }}" as="l" hint-placeholder-count="4">
            <div style="display: flex; gap: 10px; font-size: 14px; border-top: 1px solid #30354A; padding-top: 10px">
              <span style="color: #A9A69F; font-variant-numeric: tabular-nums; flex: none">{{l.t}}</span>
              <span>{{l.text}}</span>
            </div>
          </sc-for>
        </div>
      </aside>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1050}}'>
class Component extends DCLogic {
  renderVals() {
    const st = (name, state, detail) => {
      const map = {
        'Terminé': ['#7FC8A9', '#1A1D27', '#30354A'],
        'En cours': ['#E8A75D', '#2A2419', '#E8A75D'],
        'À venir': ['#A9A69F', '#1A1D27', '#30354A']
      }[state];
      return { name, state, detail, stateColor: map[0], bg: map[1], border: map[2] };
    };
    const steps = [
      st('Voyante', 'Terminé', 'A regardé Inès'),
      st('Loups-Garous', 'En cours', '2 / 2 ont choisi'),
      st('Sorcière', 'À venir', 'Potions : vie, mort'),
      st('Lever du jour', 'À venir', 'Annonce des morts')
    ];
    const C = { L: '#F08A6C', V: '#8DB4F0' };
    const raw = [
      ['Bastien', 'Loup-Garou', 'L', 'Caméra · micro'], ['Alice', 'Sorcière', 'V', 'Caméra · micro'],
      ['Chloé', 'Cupidon', 'V', 'Micro seul'], ['David', 'Villageois', 'V', 'Caméra'],
      ['Emma', 'Villageois', 'V', 'Caméra · micro'], ['Hugo', 'Voyante', 'V', 'Aucun'],
      ['Inès', 'Loup-Garou', 'L', 'Caméra · micro'], ['Julien', 'Villageois', 'V', 'Caméra · micro'],
      ['Léa', 'Petite Fille', 'V', 'Micro seul'], ['Marc', 'Chasseur', 'V', 'Caméra · micro']
    ];
    const rows = raw.map((r) => ({
      name: r[0], role: r[1], roleColor: C[r[2]], media: r[3],
      state: r[0] === 'Hugo' ? 'Cible des loups' : 'Vivant',
      stateColor: r[0] === 'Hugo' ? '#F08A6C' : '#EEEAE2',
      actionLabel: 'Couper le micro de ' + r[0]
    }));
    const log = [
      { t: '22:14', text: 'La Voyante regarde Inès : Loup-Garou.' },
      { t: '22:15', text: 'Le salon des loups est ouvert.' },
      { t: '22:16', text: 'Bastien et Inès choisissent Hugo (votes révélés ensemble).' },
      { t: '22:16', text: 'La Petite Fille n’a pas espionné.' }
    ];
    return { steps, rows, log };
  }
}
</script>
</body>
</html>
